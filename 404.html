<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page not found · yilmazdoga.net</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0a0a">
  <script>(function(){try{if(localStorage.getItem('theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
  <style>
    /* site font, pulled via absolute path so it resolves from any 404 URL; falls back to the same serif stack the main site declares */
    @font-face {
      font-family: 'Linux Biolinum';
      src: url('/assets/fonts/linux_biolinum/LinBiolinum_R.woff2') format('woff2'),
           url('/assets/fonts/linux_biolinum/LinBiolinum_R.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --main-bg-color: rgb(10, 10, 10);
      --main-txt-color: rgb(240, 240, 240);
      --hover-color: linear-gradient(90deg, rgb(131, 58, 180), rgb(253, 29, 29), rgb(252, 176, 69));
      --nav-bg: rgba(10, 10, 10, 0.7);
      --nav-border: rgba(255, 255, 255, 0.08);
      --nav-underline: rgba(255, 255, 255, 0.35);
      --nav-height: 56px;
      --scan: rgba(255, 255, 255, 0.03);
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    :root[data-theme="light"] {
      --main-bg-color: rgb(247, 247, 248);
      --main-txt-color: rgb(22, 22, 24);
      --nav-bg: rgba(247, 247, 248, 0.7);
      --nav-border: rgba(0, 0, 0, 0.10);
      --nav-underline: rgba(0, 0, 0, 0.35);
      --scan: rgba(0, 0, 0, 0.03);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; min-height: 100%; }

    body {
      background-color: var(--main-bg-color);
      color: var(--main-txt-color);
      font-family: 'Linux Biolinum', Georgia, 'Times New Roman', serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* faint scanlines for a retro-terminal vibe */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, var(--scan) 0, var(--scan) 1px, transparent 1px, transparent 3px);
      z-index: 6;
      opacity: 0.5;
    }

    /* ---- top navigation: identical to the main site ---- */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      background: var(--nav-bg);
      border-bottom: 1px solid var(--nav-border);
      font-size: 1.2rem;
      height: var(--nav-height);
      box-sizing: border-box;
    }

    .top-nav .nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .top-nav a {
      text-decoration: none;
      color: var(--main-txt-color);
    }

    .top-nav .nav-brand {
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .top-nav .nav-links {
      display: flex;
      gap: 18px;
    }

    .top-nav .nav-links a {
      opacity: 0.9;
      padding: 8px 2px;
    }

    .top-nav .nav-links a:hover,
    .top-nav .nav-brand:hover {
      background: var(--hover-color);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* theme toggle */
    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      margin: 0;
      padding: 8px;
      color: var(--main-txt-color);
      cursor: pointer;
      line-height: 0;
      border-radius: 6px;
      -webkit-tap-highlight-color: transparent;
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .theme-toggle:hover { color: rgb(252, 176, 69); }
    .theme-toggle .icon-moon { display: none; }
    :root[data-theme="light"] .theme-toggle .icon-sun { display: none; }
    :root[data-theme="light"] .theme-toggle .icon-moon { display: block; }

    /* ---- 404 content ---- */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem 1rem 3rem;
      width: 100%;
    }

    .gradient {
      background: linear-gradient(90deg, rgb(131, 58, 180), rgb(253, 29, 29), rgb(252, 176, 69), rgb(131, 58, 180));
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: flow 6s linear infinite;
    }

    @keyframes flow { to { background-position: 200% center; } }

    .code {
      font-family: var(--mono);
      font-weight: 800;
      font-size: clamp(3.2rem, 22vw, 8rem);
      line-height: 0.9;
      margin: 0;
      letter-spacing: 0.05em;
    }

    .art {
      width: 100%;
      max-width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0.8rem 0 0.4rem;
      min-height: 16em;
      filter: drop-shadow(0 0 6px rgba(253, 29, 29, 0.30));
      overflow: hidden;
    }

    .art pre {
      margin: 0;
      font-family: var(--mono);
      white-space: pre;
      text-align: left;
      display: inline-block;
      font-size: clamp(0.42rem, 2.6vw, 0.95rem);
      line-height: 1.12;
    }

    .sub {
      font-size: clamp(1rem, 4.5vw, 1.3rem);
      opacity: 0.85;
      min-height: 2.6em;
      max-width: 32ch;
      margin: 0.3rem auto 0;
    }

    .hint {
      margin-top: 1.2rem;
      font-family: var(--mono);
      font-size: 0.78rem;
      opacity: 0.4;
    }

    @media (max-width: 680px) {
      .top-nav { font-size: 1.05rem; }
      .top-nav .nav-inner { padding: 0 14px; }
    }

    @media (max-width: 600px) {
      .art { min-height: 14em; margin-top: 0.4rem; }
      .hint .desktop-only { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .gradient { animation: none; }
    }
  </style>
</head>

<body>
  <header class="top-nav" role="navigation" aria-label="Primary">
    <div class="nav-inner">
      <a class="nav-brand" href="https://yilmazdoga.net">yilmazdoga.net</a>
      <nav class="nav-links">
        <a href="https://yilmazdoga.net/index.html">Home</a>
        <a href="https://yilmazdoga.net/cv.html">CV</a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch color theme" title="Switch theme">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <h1 class="code gradient" aria-label="404">404</h1>
    <div class="art" aria-hidden="true"><pre id="art" class="gradient"></pre></div>
    <p class="sub" id="sub" role="status"></p>
    <p class="hint"><span class="desktop-only">click or press any key to shuffle · </span><span id="scene-name"></span></p>
  </main>

  <script>
    (function () {
      "use strict";

      // ---- theme toggle (mirrors the main site) -----------------------------
      var root = document.documentElement;
      var toggle = document.getElementById("theme-toggle");
      var tcMeta = document.querySelector('meta[name="theme-color"]');

      function applyTheme(theme, persist) {
        if (theme === "light") root.setAttribute("data-theme", "light");
        else root.removeAttribute("data-theme");
        if (toggle) toggle.setAttribute("aria-pressed", theme === "light" ? "true" : "false");
        if (tcMeta) tcMeta.setAttribute("content", theme === "light" ? "#f7f7f8" : "#0a0a0a");
        if (persist) { try { localStorage.setItem("theme", theme); } catch (e) { /* ignore */ } }
      }

      var theme = root.getAttribute("data-theme") === "light" ? "light" : "dark";
      applyTheme(theme, false);
      if (toggle) {
        toggle.addEventListener("click", function () {
          theme = theme === "light" ? "dark" : "light";
          applyTheme(theme, true);
        });
      }

      // ---- ascii animation --------------------------------------------------
      var W = 58, H = 15;

      function rnd(n) { return Math.floor(Math.random() * n); }
      function pick(a) { return a[rnd(a.length)]; }

      function grid(fill) {
        var g = [], r;
        for (r = 0; r < H; r++) g.push(new Array(W).fill(fill || " "));
        return g;
      }
      function flat(g) { return g.map(function (r) { return r.join(""); }).join("\n"); }

      var fish = {
        name: "gone-fishing", speed: 110,
        setup: function () {
          this.school = [];
          for (var i = 0; i < 5; i++) {
            this.school.push({
              x: Math.random() * W, y: 2 + rnd(H - 3),
              dir: Math.random() < 0.5 ? 1 : -1, sp: 0.4 + Math.random() * 0.9
            });
          }
          this.bub = [];
          for (var b = 0; b < 12; b++) this.bub.push({ x: rnd(W), y: rnd(H) });
        },
        frame: function (t) {
          var g = grid(" "), c, k;
          for (c = 0; c < W; c++) g[0][c] = Math.sin((c + t) / 2.2) > 0 ? "~" : "-";
          this.bub.forEach(function (o) {
            if (t % 2 === 0) { o.y -= 1; if (o.y < 1) { o.y = H - 1; o.x = rnd(W); } }
            if (o.y > 0 && o.y < H && o.x >= 0 && o.x < W) g[o.y][o.x] = "°";
          });
          this.school.forEach(function (f) {
            f.x += f.dir * f.sp;
            var gl = f.dir > 0 ? "><(((º>" : "<º)))><";
            if (f.x > W + 8) f.x = -8;
            if (f.x < -8) f.x = W + 8;
            var xi = Math.round(f.x);
            for (k = 0; k < gl.length; k++) {
              var cx = xi + k;
              if (cx >= 0 && cx < W && f.y > 0 && f.y < H) g[f.y][cx] = gl.charAt(k);
            }
          });
          return flat(g);
        }
      };

      var splat = {
        name: "gaussian-splat", speed: 60,
        setup: function () { this.reset(); },
        reset: function () {
          this.p = [];
          for (var i = 0; i < 80; i++) {
            var a = Math.random() * Math.PI * 2, s = 0.2 + Math.random() * 1.2;
            this.p.push({ x: W / 2, y: H / 2, vx: Math.cos(a) * s, vy: Math.sin(a) * s * 0.55 });
          }
          this.age = 0;
        },
        frame: function (t) {
          this.age++;
          if (this.age > 48) this.reset();
          var g = grid(" "), d = this.age;
          var ch = d < 8 ? "@" : d < 16 ? "O" : d < 26 ? "o" : d < 38 ? "*" : "·";
          for (var i = 0; i < this.p.length; i++) {
            var pt = this.p[i];
            pt.x += pt.vx; pt.y += pt.vy;
            var xi = Math.round(pt.x), yi = Math.round(pt.y);
            if (xi >= 0 && xi < W && yi >= 0 && yi < H) g[yi][xi] = ch;
          }
          return flat(g);
        }
      };

      var glitch = {
        name: "signal-lost", speed: 70,
        setup: function () {},
        frame: function (t) {
          var lines = ["", "", " 4 0 4 ", "", "P A G E   N O T   F O U N D", "", ""];
          var cs = "!<>-_\\/[]{}=+*#01?%&@$";
          var prog = (t % 44) / 28;
          return lines.map(function (line) {
            return line.split("").map(function (chr) {
              if (chr === " ") return " ";
              return Math.random() < prog ? chr : cs.charAt(rnd(cs.length));
            }).join("");
          }).join("\n");
        }
      };

      // --- research-themed scenes ---

      // image denoising: static that pulses down to reveal a clean "404"
      var denoise = {
        name: "denoising", speed: 80,
        setup: function () {
          var font = { "4": ["# #", "# #", "###", "  #", "  #"], "0": ["###", "# #", "# #", "# #", "###"] };
          var seq = ["4", "0", "4"];
          this.sig = grid(" ");
          var ox = Math.round((W - 11) / 2), oy = Math.round((H - 5) / 2), cx = ox;
          for (var s = 0; s < seq.length; s++) {
            var rows = font[seq[s]];
            for (var r = 0; r < 5; r++) for (var c = 0; c < 3; c++) {
              if (rows[r].charAt(c) === "#") this.sig[oy + r][cx + c] = "#";
            }
            cx += 4;
          }
        },
        frame: function (t) {
          var cs = "@%#*+=-:.";
          var ph = (t % 64) / 64;
          var noise = ph < 0.5 ? 1 - ph * 2 : (ph - 0.5) * 2; // 1 -> 0 -> 1
          var g = grid(" ");
          for (var r = 0; r < H; r++) for (var c = 0; c < W; c++) {
            g[r][c] = Math.random() < noise ? cs.charAt(rnd(cs.length)) : this.sig[r][c];
          }
          return flat(g);
        }
      };

      // path tracing: a photon bouncing inside a Cornell box, with a fading trail
      var photon = {
        name: "path-tracing", speed: 55,
        setup: function () {
          this.x = W / 2; this.y = H / 2;
          this.vx = (Math.random() < 0.5 ? 1 : -1) * (0.7 + Math.random());
          this.vy = (Math.random() < 0.5 ? 1 : -1) * (0.4 + Math.random() * 0.5);
          this.trail = [];
        },
        frame: function (t) {
          var g = grid(" "), c, r;
          for (c = 0; c < W; c++) { g[0][c] = "-"; g[H - 1][c] = "-"; }
          for (r = 0; r < H; r++) { g[r][0] = "|"; g[r][W - 1] = "|"; }
          g[0][0] = "+"; g[0][W - 1] = "+"; g[H - 1][0] = "+"; g[H - 1][W - 1] = "+";
          this.x += this.vx; this.y += this.vy;
          if (this.x <= 1 || this.x >= W - 2) { this.vx *= -1; this.x = Math.max(1, Math.min(W - 2, this.x)); }
          if (this.y <= 1 || this.y >= H - 2) { this.vy *= -1; this.y = Math.max(1, Math.min(H - 2, this.y)); }
          this.trail.push([Math.round(this.x), Math.round(this.y)]);
          if (this.trail.length > 14) this.trail.shift();
          var chars = ".:*oO@";
          for (var i = 0; i < this.trail.length; i++) {
            var p = this.trail[i], ci = Math.floor(i / this.trail.length * (chars.length - 1));
            if (p[0] > 0 && p[0] < W - 1 && p[1] > 0 && p[1] < H - 1) g[p[1]][p[0]] = chars.charAt(ci);
          }
          return flat(g);
        }
      };

      // Gaussian splatting: a random point cloud that optimizes into "404"
      var splatfit = {
        name: "splat-fit", speed: 55,
        setup: function () {
          var font = { "4": ["# #", "# #", "###", "  #", "  #"], "0": ["###", "# #", "# #", "# #", "###"] };
          var seq = ["4", "0", "4"], targets = [];
          var ox = Math.round((W - 11) / 2), oy = Math.round((H - 5) / 2), cx = ox;
          for (var s = 0; s < seq.length; s++) {
            var rows = font[seq[s]];
            for (var r = 0; r < 5; r++) for (var c = 0; c < 3; c++) {
              if (rows[r].charAt(c) === "#") targets.push([cx + c, oy + r]);
            }
            cx += 4;
          }
          this.p = targets.map(function (tp) { return { x: rnd(W), y: rnd(H), tx: tp[0], ty: tp[1] }; });
          this.age = 0;
        },
        frame: function (t) {
          this.age++;
          if (this.age > 90) { this.p.forEach(function (o) { o.x = rnd(W); o.y = rnd(H); }); this.age = 0; }
          var g = grid(" ");
          this.p.forEach(function (o) {
            o.x += (o.tx - o.x) * 0.12; o.y += (o.ty - o.y) * 0.12;
            var d = Math.abs(o.x - o.tx) + Math.abs(o.y - o.ty);
            var ch = d < 0.6 ? "@" : d < 2 ? "O" : d < 5 ? "o" : "·";
            var xi = Math.round(o.x), yi = Math.round(o.y);
            if (xi >= 0 && xi < W && yi >= 0 && yi < H) g[yi][xi] = ch;
          });
          return flat(g);
        }
      };

      // inverse rendering / relighting: a moving light shades the surface
      var relight = {
        name: "relighting", speed: 65,
        setup: function () {},
        frame: function (t) {
          var ramp = " .:-=+*#%@";
          var lx = W / 2 + Math.cos(t * 0.08) * W * 0.42;
          var ly = H / 2 + Math.sin(t * 0.12) * H * 0.42;
          var g = grid(" ");
          for (var r = 0; r < H; r++) for (var c = 0; c < W; c++) {
            var dx = (c - lx) / (W * 0.5), dy = (r - ly) / (H * 0.5) * 2;
            var b = Math.max(0, 1 - Math.sqrt(dx * dx + dy * dy));
            g[r][c] = ramp.charAt(Math.min(ramp.length - 1, Math.floor(b * ramp.length)));
          }
          return flat(g);
        }
      };

      // Monte Carlo integration: darts estimate pi, the circle emerges
      var montecarlo = {
        name: "monte-carlo", speed: 55,
        setup: function () {
          this.buf = grid(" ");
          this.inside = 0; this.total = 0; this.age = 0;
          this.cy = Math.round((2 + (H - 1)) / 2);
          this.ry = Math.floor(((H - 1) - 2) / 2);
          this.rx = this.ry * 2;
          this.cx = Math.round(W / 2);
        },
        frame: function (t) {
          this.age++;
          if (this.age > 130) this.setup();
          for (var k = 0; k < 12; k++) {
            var u = Math.random() * 2 - 1, v = Math.random() * 2 - 1; // uniform in [-1,1]^2
            var inC = u * u + v * v <= 1;
            this.total++; if (inC) this.inside++;
            var x = Math.round(this.cx + u * this.rx), y = Math.round(this.cy + v * this.ry);
            if (y >= 0 && y < H && x >= 0 && x < W) this.buf[y][x] = inC ? "*" : "·";
          }
          var g = this.buf.map(function (row) { return row.slice(); });
          var est = this.total ? (4 * this.inside / this.total) : 0;
          var label = "monte carlo   π ≈ " + est.toFixed(3) + "   n=" + this.total;
          for (var i = 0; i < label.length && i < W; i++) g[0][i] = label.charAt(i);
          return flat(g);
        }
      };

      var SCENES = [fish, splat, glitch, denoise, photon, splatfit, relight, montecarlo];

      var SUBS = [
        "Lost in latent space, try the homepage.",
        "Ray missed every surface in the scene.",
        "Out of distribution. Returning to a known sample?",
        "This route never converged.",
        "The pixels you are looking for are in another castle.",
        "Gradient descent walked right off the page.",
        "The seals are sunbathing on this page.",
        "I'd tell a Gaussian joke, but it's a bit of a blur.",
        "A NeRF walks into a bar but only from one viewpoint.",
        "I'd optimize this joke, but the gradient vanished.",
      ];

      var el = document.getElementById("art");
      var subEl = document.getElementById("sub");
      var nameEl = document.getElementById("scene-name");
      var timer = null, t = 0, scene = null;

      function shuffle() {
        if (timer) clearInterval(timer);
        t = 0;
        scene = pick(SCENES);
        if (scene.setup) scene.setup();
        subEl.textContent = pick(SUBS);
        nameEl.textContent = scene.name;
        el.textContent = scene.frame(t++);
        timer = setInterval(function () { el.textContent = scene.frame(t++); }, scene.speed);
      }

      shuffle();

      // reshuffle on interaction, but leave links and the nav controls alone
      document.addEventListener("click", function (e) {
        if (e.target.closest("a, button")) return;
        shuffle();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Tab" || e.altKey || e.metaKey || e.ctrlKey) return;
        if (e.target && e.target.closest && e.target.closest("a, button")) return;
        shuffle();
      });

      // pause animation when the tab is hidden (saves battery on mobile)
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          if (timer) { clearInterval(timer); timer = null; }
        } else if (!timer && scene) {
          timer = setInterval(function () { el.textContent = scene.frame(t++); }, scene.speed);
        }
      });
    })();
  </script>
</body>

</html>
